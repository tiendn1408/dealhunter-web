<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Tem giá</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#F4F1E6;color:#0A3832;font-family:"Be Vietnam Pro",system-ui;overflow:hidden}
nav{display:flex;justify-content:space-between;padding:28px 56px;font-size:16px}
.hero{display:grid;grid-template-columns:1fr 1fr;padding:30px 56px;gap:40px;align-items:center}
h1{font-size:120px;font-weight:800;line-height:.92;letter-spacing:-.04em}
.slot{display:flex;background:#0A3832;color:#F4F1E6;margin-top:40px;font-size:20px}
.slot span{flex:1;padding:22px}.slot b{background:#FFC24D;color:#0A3832;padding:22px 30px}
.sticker{background:#1A9988;color:#fff;border-radius:999px;width:520px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:96px;font-weight:800}
.sticker small{font-size:28px;font-weight:600}
</style></head><body>
<nav><b>DealHunter</b><span>Đang theo dõi · Đăng nhập</span></nav>
<div class="hero"><div><h1>Dán link. Xem tem giá thật.</h1><div class="slot"><span>Dán link sản phẩm…</span><b>Xem giá</b></div></div>
<div class="sticker"><small>Giá hôm nay</small>990.000đ<small>thấp nhất 30 ngày</small></div></div></body></html>
